<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Roster & Leaderboard</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                    },
                    colors: {
                        brand: {
                            500: '#8b5cf6', // Violet 500
                            600: '#7c3aed', // Violet 600
                            900: '#4c1d95', // Violet 900
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Flexbox Absolut untuk Vertikal Center Desain Compact */
        .cell-center {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            padding: 0 6px;
            box-sizing: border-box;
        }
        .cell-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 26px; 
            padding: 0 6px;
            box-sizing: border-box;
        }
        .cell-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 26px; 
            padding: 0 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end pointer-events-none"></div>

    <!-- Main App Container -->
    <div id="app" class="flex-grow flex flex-col w-full max-w-[95%] mx-auto px-2 sm:px-4 lg:px-8">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <!-- Footer 
    <footer class="py-6 text-center text-slate-500 text-sm mt-auto">
         <p>&copy; 2026 Tournament Roster. Powered by HTML, CSS, & JS.</p>
    </footer> -->

    <script>
        // --- KONFIGURASI CLOUDFLARE WORKER API ---
        const API_URL = "https://roster-api.team-id.workers.dev";

        // --- GLOBAL STATE ---
        const state = {
            currentUser: null,
            view: 'login',
            currentStage: localStorage.getItem('currentStage') || 'Qualifier',
            adminStage: localStorage.getItem('adminStage') || 'Qualifier',
            adminMod: localStorage.getItem('adminMod') || 'NM',
            players: [],
            beatmaps: [],
            scores: []
        };

        let isOnline = false;

        // --- UTILITIES ---
        window.generateId = function() { return Math.random().toString(36).substr(2, 9); }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgColor = 'bg-blue-600';
            let icon = '<i class="fa-solid fa-circle-info mr-2"></i>';
            if (type === 'error') { bgColor = 'bg-red-600'; icon = '<i class="fa-solid fa-circle-exclamation mr-2"></i>'; } 
            else if (type === 'success') { bgColor = 'bg-green-600'; icon = '<i class="fa-solid fa-circle-check mr-2"></i>'; } 
            else if (type === 'warning') { bgColor = 'bg-yellow-600'; icon = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>'; }
            toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-xl mb-3 flex items-center transition-all duration-300 opacity-0 transform translate-x-10 pointer-events-auto z-50`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-x-10'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.changeStage = function(stage) {
            state.currentStage = stage;
            localStorage.setItem('currentStage', stage);
            renderApp();
        }

        window.changeAdminStage = function(stage) {
            state.adminStage = stage;
            localStorage.setItem('adminStage', stage);
            renderApp();
        }

        window.changeAdminMod = function(mod) {
            state.adminMod = mod;
            localStorage.setItem('adminMod', mod);
        }

        // --- DATABASE FETCH (CLOUDFLARE) ---
        async function fetchDatabase() {
            if (!API_URL) return; 
            try {
                const response = await fetch(`${API_URL}/data`);
                if(response.ok) {
                    const data = await response.json();
                    state.players = data.players || [];
                    state.beatmaps = data.beatmaps || [];
                    state.scores = data.scores || [];
                    
                    const modOrder = {'NM':1, 'HD':2, 'HR':3, 'DT':4, 'MM':5, 'TB':6};
                    state.beatmaps.sort((a,b) => modOrder[a.mod] - modOrder[b.mod] || a.name.localeCompare(b.name));
                    
                    isOnline = true;
                    renderApp();
                }
            } catch (error) {
                console.error("Gagal mengambil data dari Worker:", error);
                isOnline = false;
            }
        }

        // --- ACTIONS ---
        window.login = function(username, password) {
            const user = state.players.find(p => p.username === username && p.password === password);
            if (user) {
                state.currentUser = user;
                state.view = 'leaderboard';
                showToast(`Selamat datang, ${user.username}!`, 'success');
                renderApp();
            } else {
                showToast('Username atau password salah!', 'error');
            }
        }

        window.logout = function() {
            state.currentUser = null;
            state.view = 'login';
            showToast('Anda telah logout.', 'info');
            renderApp();
        }

        window.navigate = function(viewName) {
            state.view = viewName;
            renderApp();
        }

        window.addPlayer = async function(username, password) {
            if (state.players.some(p => p.username === username)) {
                showToast('Username sudah digunakan!', 'error'); return;
            }
            if(API_URL) {
                await fetch(`${API_URL}/players`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({username, password}) 
                });
                await fetchDatabase();
            } else {
                state.players.push({ id: window.generateId(), username, password, role: 'player' });
                renderApp();
            }
            showToast('Player berhasil ditambahkan!', 'success');
        }

        window.removePlayer = async function(playerId) {
            if (!confirm('Peringatan: Apakah Anda yakin ingin menghapus player ini? Seluruh data skor milik player ini akan ikut terhapus secara permanen.')) return;
            
            if(API_URL) {
                await fetch(`${API_URL}/players?id=${playerId}`, { method: 'DELETE' });
                await fetchDatabase();
            } else {
                state.players = state.players.filter(p => p.id !== playerId);
                state.scores = state.scores.filter(s => s.player_id !== playerId);
                renderApp();
            }
            showToast('Player berhasil dihapus!', 'success');
        }

        window.addBeatmap = async function(stage, mod) {
            const mapsInCurrentStage = state.beatmaps.filter(b => (b.stage || 'Qualifier') === stage && b.mod === mod);
            const nextNumber = mapsInCurrentStage.length + 1;
            let autoName = `${mod}${nextNumber}`; 
            
            if (mod === 'TB' && mapsInCurrentStage.length === 0) {
                autoName = 'TB';
            }

            if(API_URL) {
                await fetch(`${API_URL}/beatmaps`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({stage, mod, name: autoName}) 
                });
                await fetchDatabase();
            } else {
                state.beatmaps.push({ id: window.generateId(), stage, mod, name: autoName });
                const modOrder = {'NM':1, 'HD':2, 'HR':3, 'DT':4, 'MM':5, 'TB':6};
                state.beatmaps.sort((a,b) => modOrder[a.mod] - modOrder[b.mod] || a.name.localeCompare(b.name));
                renderApp();
            }
            showToast(`Map ${autoName} berhasil ditambahkan ke ${stage}!`, 'success');
        }

        window.removeBeatmap = async function(beatmapId) {
            if (!confirm('Peringatan: Apakah Anda yakin ingin menghapus beatmap ini? Seluruh data skor pada map ini akan ikut terhapus.')) return;
            
            if(API_URL) {
                await fetch(`${API_URL}/beatmaps?id=${beatmapId}`, { method: 'DELETE' });
                await fetchDatabase();
            } else {
                state.beatmaps = state.beatmaps.filter(b => b.id !== beatmapId);
                renderApp();
            }
            showToast('Beatmap berhasil dihapus!', 'success');
        }

        window.validateScore = function(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val.length > 0) {
                if (val.startsWith('1')) {
                    if (val.length > 7) val = val.slice(0, 7);
                    if (parseInt(val) > 1300000) val = '1300000';
                } else {
                    if (val.length > 6) val = val.slice(0, 6);
                }
                input.value = Number(val).toLocaleString('en-US'); 
            } else {
                input.value = '';
            }
        }

        window.saveScores = async function(event, form) {
            event.preventDefault();
            const formData = new FormData(form);
            let added = 0;
            let batchData = [];

            for (let [key, value] of formData.entries()) {
                if (!value || value.trim() === '') continue;
                
                const scoreStr = value.replace(/,/g, '');
                const score = Number(scoreStr);
                
                if (isNaN(score) || score <= 0) continue;

                const mapKey = key.replace('score_', ''); 

                if(API_URL) {
                    batchData.push({ player_id: state.currentUser.id, map_key: mapKey, score: score });
                } else {
                    const existingIdx = state.scores.findIndex(
                        s => s.player_id === state.currentUser.id && s.map_key === mapKey
                    );
                    if (existingIdx !== -1) {
                        state.scores[existingIdx].score = score;
                    } else {
                        state.scores.push({
                            id: window.generateId(),
                            player_id: state.currentUser.id,
                            map_key: mapKey,
                            score: score
                        });
                    }
                }
                added++;
            }
            
            if (added > 0) {
                if(API_URL) {
                    await fetch(`${API_URL}/scores/batch`, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(batchData) 
                    });
                    await fetchDatabase();
                }
                showToast(`Tersimpan: ${added} input skor Run ditambahkan.`, 'success');
                window.navigate('leaderboard');
            } else {
                showToast('Tidak ada skor valid yang diinput.', 'warning');
            }
        }

        // --- DATA PROCESSING ---
        function getLeaderboardData(currentStageMaps) {
            const playerList = state.players.filter(p => p.role === 'player');
            const mapStats = {}; 
            
            currentStageMaps.forEach(map => {
                const subMods = map.mod === 'MM' ? ['NM', 'HD', 'HR'] : [null];
                subMods.forEach(subMod => {
                    const mapBaseKey = subMod ? `${map.id}_${subMod}` : map.id;
                    mapStats[mapBaseKey] = [];
                    
                    playerList.forEach(player => {
                        let sum = 0;
                        let count = 0;
                        
                        for(let r=1; r<=3; r++) {
                            const exactKey = subMod ? `${map.id}_${r}_${subMod}` : `${map.id}_${r}`;
                            const playerRuns = state.scores.filter(s => s.player_id === player.id && s.map_key === exactKey);
                            if (playerRuns.length > 0) {
                                sum += playerRuns[playerRuns.length - 1].score; 
                                count++;
                            }
                        }
                        
                        let avg = null;
                        if (count > 0) {
                            avg = Math.round(sum / count);
                        }

                        if (avg !== null) {
                            mapStats[mapBaseKey].push({ playerId: player.id, average: avg });
                        }
                    });
                    
                    mapStats[mapBaseKey].sort((a, b) => b.average - a.average);
                });
            });

            const rankings = playerList.map(player => {
                let sumPlacements = 0;
                let sumScores = 0;
                let mapsPlayed = 0;
                const mapAverages = {}; 
                const mapRanks = {};
                
                Object.keys(mapStats).forEach(mapKey => {
                    const mapRanking = mapStats[mapKey];
                    const playerRankIndex = mapRanking.findIndex(p => p.playerId === player.id);
                    
                    if (playerRankIndex !== -1) {
                        const rank = playerRankIndex + 1; 
                        sumPlacements += rank;
                        sumScores += mapRanking[playerRankIndex].average;
                        mapsPlayed++;
                        mapAverages[mapKey] = mapRanking[playerRankIndex].average;
                        mapRanks[mapKey] = rank;
                    } else {
                        mapAverages[mapKey] = null;
                        mapRanks[mapKey] = null;
                    }
                });
                
                const avgRank = mapsPlayed > 0 ? (sumPlacements / mapsPlayed) : 999; 
                const avgScore = mapsPlayed > 0 ? Math.round(sumScores / mapsPlayed) : 0;
                
                return {
                    id: player.id, username: player.username,
                    avgRank, avgScore, mapAverages, mapRanks, mapsPlayed
                };
            });

            rankings.sort((a, b) => {
                if (a.avgRank !== b.avgRank) return a.avgRank - b.avgRank;
                return b.avgScore - a.avgScore; 
            });

            return { rankings, mapStats };
        }

        // --- CSS GRID ROSTER HELPERS ---
        function getMapColor(mod) {
            if(mod === 'NM') return 'bg-[#a9d18e]'; 
            if(mod === 'HD') return 'bg-[#ffd966]'; 
            if(mod === 'HR') return 'bg-[#ea9999]'; 
            if(mod === 'DT') return 'bg-[#9bc2e6]'; 
            if(mod === 'MM') return 'bg-[#c2c2f0]';
            if(mod === 'TB') return 'bg-[#d9d9d9]';
            return 'bg-slate-300';
        }

        function getSubColor(mod) {
            if(mod === 'NM') return 'bg-[#e2efda]'; 
            if(mod === 'HD') return 'bg-[#fff2cc]';
            if(mod === 'HR') return 'bg-[#f4cccc]';
            if(mod === 'DT') return 'bg-[#ddebf7]';
            if(mod === 'MM') return 'bg-[#e6e6f9]'; 
            if(mod === 'TB') return 'bg-[#f2f2f2]';
            return 'bg-[#e2efda]';
        }

        // --- UI RENDERING COMPONENTS ---
        function renderNavbar() {
            if (!state.currentUser) return '';
            const navLinks = `
                <button onclick="window.navigate('leaderboard')" class="${state.view === 'leaderboard' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition py-2 whitespace-nowrap px-1">
                    <i class="fa-solid fa-trophy mr-1"></i> Leaderboard
                </button>
                ${state.currentUser.role === 'player' ? `
                    <button onclick="window.navigate('submit')" class="${state.view === 'submit' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition py-2 whitespace-nowrap px-1">
                        <i class="fa-solid fa-upload mr-1"></i> Submit Score
                    </button>
                ` : ''}
                ${state.currentUser.role === 'admin' ? `
                    <button onclick="window.navigate('admin')" class="${state.view === 'admin' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition py-2 whitespace-nowrap px-1">
                        <i class="fa-solid fa-gear mr-1"></i> Manage
                    </button>
                ` : ''}
            `;

            return `
                <nav class="bg-slate-800 border-b border-slate-700 py-4 mb-8 rounded-b-xl shadow-lg relative">
                    <div class="flex flex-col lg:flex-row justify-between items-center px-4 sm:px-6 h-full relative gap-4 lg:gap-0">
                        <div class="text-xl font-bold tracking-wider text-brand-500 flex items-center shrink-0 w-full lg:w-1/3 justify-center lg:justify-start">
                            <i class="fa-solid fa-gamepad mr-2"></i>ROSTER GENERATOR
                            ${API_URL === '' ? '<span class="text-[10px] bg-yellow-500/20 text-yellow-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-triangle-exclamation"></i> Offline Mode</span>' : 
                            (isOnline ? '<span class="text-[10px] bg-green-500/20 text-green-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-cloud"></i> Online</span>' : '<span class="text-[10px] bg-red-500/20 text-red-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-cloud-arrow-down"></i> Error</span>')}
                        </div>
                        
                        <div class="flex justify-center items-center gap-4 sm:gap-6 w-full lg:w-auto lg:absolute lg:left-1/2 lg:-translate-x-1/2 overflow-x-auto text-sm sm:text-base px-2">
                            ${navLinks}
                        </div>

                        <div class="flex items-center justify-center lg:justify-end w-full lg:w-1/3 shrink-0">
                            <div class="flex items-center justify-center bg-slate-700 px-4 py-2 rounded-full w-fit text-sm sm:text-base">
                                <i class="fa-solid fa-user-circle text-lg sm:text-xl text-slate-300 mr-2"></i>
                                <span class="mr-4 font-medium">${state.currentUser.username} <span class="text-xs text-brand-400 hidden sm:inline">(${state.currentUser.role})</span></span>
                                <button onclick="window.logout()" class="text-red-400 hover:text-red-300 transition" title="Logout">
                                    <i class="fa-solid fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in pt-10">
                    <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md mx-4">
                        <div class="text-center mb-8">
                            <i class="fa-solid fa-gamepad text-4xl sm:text-5xl text-brand-500 mb-3"></i>
                            <h2 class="text-2xl sm:text-3xl font-bold">Roster Generator</h2>
                                <br>

                        <form onsubmit="event.preventDefault(); window.login(this.username.value, this.password.value);" class="space-y-4 sm:space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-user"></i></div>
                                    <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-10 pr-4 py-2.5 sm:py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" placeholder="Masukkan username">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-lock"></i></div>
                                    <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-10 pr-4 py-2.5 sm:py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" placeholder="Masukkan password">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-2.5 sm:py-3 px-4 rounded-lg shadow-lg hover:shadow-brand-500/30 transition duration-200">
                                Login Sekarang
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderLeaderboard() {
            const currentStageMaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === state.currentStage);
            const data = getLeaderboardData(currentStageMaps);
            const isQualifier = state.currentStage === 'Qualifier';

            let viewHTML = '';

            if (isQualifier) {
                // --- TAMPILAN QUALIFIER ---
                let mapHeaders = '';
                currentStageMaps.forEach(map => {
                    if (map.mod === 'MM') {
                        mapHeaders += `
                            <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} NM</th>
                            <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} HD</th>
                            <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} HR</th>
                        `;
                    } else {
                        let bgColor = 'bg-slate-700'; let textColor = 'text-white';
                        if(map.mod === 'NM') { bgColor = 'bg-emerald-400'; textColor = 'text-emerald-950'; }
                        if(map.mod === 'HD') { bgColor = 'bg-amber-500'; textColor = 'text-amber-950'; }
                        if(map.mod === 'HR') { bgColor = 'bg-red-500'; textColor = 'text-white'; }
                        if(map.mod === 'DT') { bgColor = 'bg-sky-400'; textColor = 'text-sky-950'; }
                        if(map.mod === 'TB') { bgColor = 'bg-slate-400'; textColor = 'text-slate-900'; }
                        
                        mapHeaders += `<th class="px-4 py-3 text-sm font-extrabold ${textColor} ${bgColor} uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name}</th>`;
                    }
                });

                let rows = data.rankings.map((player, index) => {
                    let mapCells = '';
                    currentStageMaps.forEach(map => {
                        const subMods = map.mod === 'MM' ? ['NM', 'HD', 'HR'] : [null];
                        subMods.forEach(subMod => {
                            const mapKey = subMod ? `${map.id}_${subMod}` : map.id;
                            const avg = player.mapAverages[mapKey];
                            const rank = player.mapRanks[mapKey];
                            
                            let cellClass = "px-3 py-2 whitespace-nowrap font-sans font-bold text-sm border-l border-slate-700/50 hover:bg-slate-700/80 transition align-middle";
                            
                            if (avg !== null) {
                                let rankColor = 'text-slate-500'; let scoreColor = 'text-slate-300';
                                
                                if (rank === 1) { rankColor = 'text-yellow-400 font-bold'; scoreColor = 'text-yellow-400 font-bold'; } 
                                else if (rank === 2) { rankColor = 'text-slate-300 font-bold'; scoreColor = 'text-slate-100 font-bold'; } 
                                else if (rank === 3) { rankColor = 'text-amber-600 font-bold'; scoreColor = 'text-amber-500 font-bold'; }
                                
                                mapCells += `<td class="${cellClass}">
                                    <div class="flex justify-between items-center w-full gap-2">
                                        <span class="text-xs ${rankColor} w-6 text-left">#${rank}</span>
                                        <span class="${scoreColor} flex-1 text-right font-sans font-bold">${avg.toLocaleString('en-US')}</span>
                                    </div>
                                </td>`;
                            } else {
                                mapCells += `<td class="${cellClass} text-center text-slate-600 font-medium">-</td>`;
                            }
                        });
                    });

                    return `

                                            <tr>

                `;
            } else {
                // --- TAMPILAN ROSTER GRID BARU ---
                
                const generateRegularGrid = (modsArray) => {
                    let mapsInGroup = [];
                    modsArray.forEach(m => {
                        mapsInGroup = mapsInGroup.concat(currentStageMaps.filter(b => b.mod === m));

                        const top3 = stats.slice(0, 3);
                        const backup = stats[3];
                        const total = top3.reduce((sum, p) => sum + p.average, 0);

                            let cellBg = (i % 2 === 0) ? bgColor : bgColor.replace(']', ']/80');

                                bodyRows[i] += `<td class="${cellBg} text-black border-r border-b border-black p-0"><div class="cell-left px-2">-</div></td><td class="${cellBg} text-black border-r border-b border-black p-0"><div class="cell-right font-sans">-</div></td>`;

                        if (backup) {
                            const pObj = state.players.find(pl => pl.id === backup.playerId);

                            bodyRows[3] += `<td class="${subBg} text-black border-r border-b border-black p-0"><div class="cell-left font-normal px-2">-</div></td><td class="${subBg} text-black border-r border-b border-black p-0"><div class="cell-right font-sans font-normal px-2">-</div></td>`;

                    theadRows += '</tr>';
                    tcol1Rows += '</tr>';
                    footRow += '</tr>';

                    const tbMaps = currentStageMaps.filter(b => b.mod === 'TB');

                    let tcol1Rows = '<tr>';

                    const hdColor = getMapColor('HD');
                    const nmColor = getMapColor('NM');
                    const backupColorHR = getSubColor('HR');

                    const backupColorNM = getSubColor('NM');

                        const statsHD = data.mapStats[`${map.id}_HD`] || [];
                        const statsNM = data.mapStats[`${map.id}_NM`] || [];

                        const rowsData = [

                            { stats: statsHD, mainColor: hdColor, backColor: backupColorHD },

                        let totalMapBackup = 0;

                        for(let i=0; i<3; i++) {

                            const mainP = stats[0];
                            const backupP = stats[1];

                            if(backupP) totalMapBackup += backupP.average;

                            if (mainP) {
                                const pObj = state.players.find(pl => pl.id === mainP.playerId);
                                bodyRows[i] += `<td class="${mainColor} text-black border-r border-b border-black p-0 w-[120px]"><div class="cell-left font-bold text-sm truncate w-[120px]">${pObj ? pObj.username : '-'}</div></td>`;
                                bodyRows[i] += `<td class="${mainColor} text-black border-r border-b border-black p-0 w-[80px]"><div class="cell-right font-sans font-bold text-sm">${mainP.average.toLocaleString('en-US')}</div></td>`;
                            } else {
                                bodyRows[i] += `<td class="${mainColor} text-black border-r border-b border-black p-0"><div class="cell-left px-2">-</div></td><td class="${mainColor} text-black border-r border-b border-black p-0"><div class="cell-right font-sans px-2">-</div></td>`;
                            }

                            if (backupP) {
                                const pObj = state.players.find(pl => pl.id === backupP.playerId);
                                bodyRows[i] += `<td class="${backColor} text-black border-r border-b border-black p-0 w-[100px]"><div class="cell-left text-sm font-normal truncate w-[100px]">${pObj ? pObj.username : '-'}</div></td>`;
                                bodyRows[i] += `<td class="${backColor} text-black border-r border-b border-black p-0 w-[80px]"><div class="cell-right font-sans text-sm font-normal">${backupP.average.toLocaleString('en-US')}</div></td>`;
                            } else {
                                bodyRows[i] += `<td class="${backColor} text-black border-r border-b border-black p-0"><div class="cell-left font-normal px-2">-</div></td><td class="${backColor} text-black border-r border-b border-black p-0"><div class="cell-right font-sans font-normal px-2">-</div></td>`;
                            }

                        // Baris 4: MM Total Main & Total Backup
                        bodyRows[3] += `<td colspan="2" class="${bgColor} text-black border-r border-b border-black p-0"><div class="cell-center font-bold font-sans text-[13px]">${totalMapMain.toLocaleString('en-US')}</div></td>`;
                        bodyRows[3] += `<td colspan="2" class="${bgColor} text-black border-r border-b border-black p-0"><div class="cell-center font-normal font-sans text-[13px]">${totalMapBackup.toLocaleString('en-US')}</div></td>`;
                        
                        // Baris 5: Ruang kosong agar TB Total bisa berada di bawah
                        bodyRows[4] += `<td colspan="4" class="${bgColor} border-r border-black border-t-0 p-0 m-0"><div class="h-[26px]"></div></td>`;
                    });

                    // TB MAPS
                    tbMaps.forEach(map => {
                        let tbBg = getMapColor('TB');
                        
                        theadRows += `<th colspan="2" class="${tbBg} text-black font-bold border-b border-r border-black p-0 tracking-widest"><div class="cell-center text-sm">${map.name}</div></th>`;
                        tcol1Rows += `<th class="${tbBg} text-black font-bold border-r border-b border-black p-0 w-[120px]"><div class="cell-center text-xs">Player</div></th>`;
                        tcol1Rows += `<th class="${tbBg} text-black font-bold border-r border-b border-black p-0 w-[80px]"><div class="cell-center text-xs">Score</div></th>`;

                        const stats = data.mapStats[map.id] || [];
                        const top3 = stats.slice(0, 3);
                        const backup = stats[3];
                        const totalTB = top3.reduce((sum, p) => sum + p.average, 0);

                        for(let i=0; i<3; i++) {
                            const p = top3[i];
                            let cellBg = (i % 2 === 0) ? 'bg-[#f8f8f8]' : 'bg-white'; 
                            if (p) {
                                const pObj = state.players.find(pl => pl.id === p.playerId);
                                bodyRows[i] += `<td class="${cellBg} text-black border-r border-b border-black p-0 w-[120px]"><div class="cell-left font-bold text-sm truncate w-[120px]">${pObj ? pObj.username : '-'}</div></td>`;
                                bodyRows[i] += `<td class="${cellBg} text-black border-r border-b border-black p-0 w-[80px]"><div class="cell-right font-sans font-bold text-sm">${p.average.toLocaleString('en-US')}</div></td>`;
                            } else {
                                bodyRows[i] += `<td class="${cellBg} text-black border-r border-b border-black p-0"><div class="cell-left px-2">-</div></td><td class="${cellBg} text-black border-r border-b border-black p-0"><div class="cell-right font-sans px-2">-</div></td>`;
                            }
                        }

                        let subBg = getSubColor('TB');
                        
                        if (backup) {
                            const pObj = state.players.find(pl => pl.id === backup.playerId);
                            bodyRows[3] += `<td class="${subBg} text-black border-r border-b border-black p-0 w-[120px]"><div class="cell-left text-sm font-normal truncate w-[120px]">${pObj ? pObj.username : '-'}</div></td>`;
                            bodyRows[3] += `<td class="${subBg} text-black border-r border-b border-black p-0 w-[80px]"><div class="cell-right font-sans text-sm font-normal">${backup.average.toLocaleString('en-US')}</div></td>`;
                        } else {
                            bodyRows[3] += `<td class="${subBg} text-black border-r border-b border-black p-0"><div class="cell-left font-normal px-2">-</div></td><td class="${subBg} text-black border-r border-b border-black p-0"><div class="cell-right font-sans font-normal px-2">-</div></td>`;
                        }

                        // Baris 5: Total TB
                        bodyRows[4] += `<td colspan="2" class="${tbBg} text-black border-r border-black p-0"><div class="cell-center font-bold font-sans text-[13px]">${totalTB.toLocaleString('en-US')}</div></td>`;
                    });

                    theadRows += '</tr>';
                    tcol1Rows += '</tr>';
                    
                    let combinedBody = bodyRows.filter(r => r !== '').map(rowHTML => `<tr>${rowHTML}</tr>`).join('');

                    return `
                        <div class="w-full text-center mb-6">
                            <div class="inline-block overflow-x-auto max-w-full align-top">
                                <table class="border-collapse border-[4px] border-black bg-white shadow-2xl mx-auto">
                                    <thead>${theadRows}${tcol1Rows}</thead>
                                    <tbody>${combinedBody}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                const row1 = generateRegularGrid(['NM', 'DT']); 
                const row2 = generateRegularGrid(['HD', 'HR']); 
                const row3 = generateMMAndTBGrid(); 

                let rosterHTML = row1 + row2 + row3;

                if (currentStageMaps.length === 0) {
                    rosterHTML = `<div class="bg-slate-800 p-8 text-center text-slate-500 rounded-xl border border-slate-700">Belum ada map terdaftar di stage ini.</div>`;
                }
                
                viewHTML = `
                    <div class="w-full overflow-x-auto pb-4 pt-1">
                        <div class="w-fit min-w-full rounded-xl relative pt-2 pb-2 mx-auto flex flex-col items-center">
                            ${rosterHTML}
                        </div>
                    </div>

            }

            return `
                <div class="fade-in w-full flex flex-col">
                    <div class="flex justify-center items-center mb-5 w-full">
                        <div class="flex flex-col items-center text-center">
                            <select onchange="window.changeStage(this.value)" class="bg-transparent text-2xl sm:text-3xl font-bold text-white mb-1 uppercase tracking-tight appearance-none cursor-pointer hover:text-brand-400 transition focus:outline-none w-fit text-center text-center-last px-2">
                                <option value="Qualifier" class="bg-slate-900 text-base" ${state.currentStage === 'Qualifier' ? 'selected' : ''}>QUALIFIER - PLAYER SCORES ▾</option>
                                <option value="RO32" class="bg-slate-900 text-base" ${state.currentStage === 'RO32' ? 'selected' : ''}>RO32 - ROSTER ▾</option>

                                <option value="Final" class="bg-slate-900 text-base" ${state.currentStage === 'Final' ? 'selected' : ''}>FINAL - ROSTER ▾</option>
                                <option value="Grand Final" class="bg-slate-900 text-base" ${state.currentStage === 'Grand Final' ? 'selected' : ''}>GRAND FINAL - ROSTER ▾</option>
                            </select>
                        </div>
                    </div>
                    ${viewHTML}
                </div>
            `;
        }

        function renderSubmitScore() {
            const currentStageMaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === state.currentStage);
            const modOrder = ['NM', 'HD', 'HR', 'DT', 'MM', 'TB'];
            let tableRows = '';

            function getScoreValue(mapId, run, subMod = null) {
                const exactKey = subMod ? `${mapId}_${run}_${subMod}` : `${mapId}_${run}`;
                const runs = state.scores.filter(s => s.player_id === state.currentUser.id && s.map_key === exactKey);
                return runs.length > 0 ? runs[runs.length - 1].score.toLocaleString('en-US') : '';
            }

            modOrder.forEach(mod => {
                const maps = currentStageMaps.filter(b => b.mod === mod);
                if (maps.length === 0) return;

                let modColor = 'text-white';
                if(mod === 'NM') modColor = 'text-emerald-400';
                if(mod === 'HD') modColor = 'text-amber-500';
                if(mod === 'HR') modColor = 'text-red-500';
                if(mod === 'DT') modColor = 'text-sky-400';
                if(mod === 'MM') modColor = 'text-purple-500';
                if(mod === 'TB') modColor = 'text-slate-400';

                tableRows += `
                    <tr class="bg-slate-900 border-b border-slate-700">
                        <td colspan="4" class="px-6 py-3 font-bold ${modColor} text-lg">
                            ${mod} Pool
                        </td>
                    </tr>
                `;

                maps.forEach(map => {
                    if (mod === 'MM') {
                        let runCols = '';
                        for(let r=1; r<=3; r++){
                            runCols += `
                                <td class="px-2 sm:px-3 py-3 border-r border-slate-700/50 align-middle">
                                    <div class="flex flex-col gap-2 w-full max-w-[120px] mx-auto">
                                        <div class="flex items-center gap-1 sm:gap-1.5 w-full">
                                            <span class="text-[10px] sm:text-[11px] font-bold text-emerald-400 w-5 text-left shrink-0">NM</span>
                                            <input type="text" name="score_${map.id}_${r}_NM" value="${getScoreValue(map.id, r, 'NM')}" oninput="window.validateScore(this)" class="flex-1 min-w-0 bg-slate-900 border border-slate-600 text-white rounded-lg px-2 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs sm:text-sm text-center" placeholder="0">
                                        </div>
                                        <div class="flex items-center gap-1 sm:gap-1.5 w-full">
                                            <span class="text-[10px] sm:text-[11px] font-bold text-amber-500 w-5 text-left shrink-0">HD</span>
                                            <input type="text" name="score_${map.id}_${r}_HD" value="${getScoreValue(map.id, r, 'HD')}" oninput="window.validateScore(this)" class="flex-1 min-w-0 bg-slate-900 border border-slate-600 text-white rounded-lg px-2 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs sm:text-sm text-center" placeholder="0">
                                        </div>
                                        <div class="flex items-center gap-1 sm:gap-1.5 w-full">
                                            <span class="text-[10px] sm:text-[11px] font-bold text-red-500 w-5 text-left shrink-0">HR</span>
                                            <input type="text" name="score_${map.id}_${r}_HR" value="${getScoreValue(map.id, r, 'HR')}" oninput="window.validateScore(this)" class="flex-1 min-w-0 bg-slate-900 border border-slate-600 text-white rounded-lg px-2 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs sm:text-sm text-center" placeholder="0">
                                        </div>
                                    </div>
                                </td>
                            `;
                        }
                        tableRows += `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                <td class="px-4 sm:px-6 py-4 font-medium text-slate-200 border-r border-slate-700/50 w-1/4">
                                    ${map.name}
                                </td>
                                ${runCols}
                            </tr>
                        `;
                    } else {
                        let runCols = '';
                        for(let r=1; r<=3; r++){
                            runCols += `
                                <td class="px-2 sm:px-3 py-4 border-r border-slate-700/50">
                                    <div class="relative w-full max-w-[120px] mx-auto">
                                        <div class="absolute inset-y-0 left-0 pl-2 sm:pl-2.5 flex items-center pointer-events-none text-slate-500 font-bold text-xs">#</div>
                                        <input type="text" name="score_${map.id}_${r}" value="${getScoreValue(map.id, r)}" oninput="window.validateScore(this)" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-5 sm:pl-6 pr-1 sm:pr-2 py-2 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 font-mono text-xs sm:text-sm text-left" placeholder="0">
                                    </div>
                                </td>
                            `;
                        }
                        tableRows += `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                <td class="px-4 sm:px-6 py-4 font-medium text-slate-200 border-r border-slate-700/50 w-1/4">${map.name}</td>
                                ${runCols}
                            </tr>
                        `;
                    }
                });
            });

            if (tableRows === '') {
                tableRows = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Belum ada map terdaftar di stage ini.</td></tr>`;
            }

            return `
                <div class="fade-in max-w-5xl mx-auto w-full">
                    <div class="flex flex-col mb-6 items-center">
                        <select onchange="window.changeStage(this.value)" class="bg-transparent text-2xl sm:text-3xl font-bold text-white mb-1 uppercase tracking-tight appearance-none cursor-pointer hover:text-brand-400 transition focus:outline-none w-fit text-center text-center-last px-2">
                            <option value="Qualifier" class="bg-slate-900 text-base" ${state.currentStage === 'Qualifier' ? 'selected' : ''}>Form Submission: QUALIFIER ▾</option>
                            <option value="RO32" class="bg-slate-900 text-base" ${state.currentStage === 'RO32' ? 'selected' : ''}>Form Submission: RO32 ▾</option>
                            <option value="RO16" class="bg-slate-900 text-base" ${state.currentStage === 'RO16' ? 'selected' : ''}>Form Submission: RO16 ▾</option>
                            <option value="Semi Final" class="bg-slate-900 text-base" ${state.currentStage === 'Semi Final' ? 'selected' : ''}>Form Submission: SEMI FINAL ▾</option>
                            <option value="Final" class="bg-slate-900 text-base" ${state.currentStage === 'Final' ? 'selected' : ''}>Form Submission: FINAL ▾</option>
                            <option value="Grand Final" class="bg-slate-900 text-base" ${state.currentStage === 'Grand Final' ? 'selected' : ''}>Form Submission: GRAND FINAL ▾</option>
                        </select>
                    </div>
                    
                    <form onsubmit="window.saveScores(event, this)" class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden">
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead class="bg-slate-900">
                                    <tr>
                                        <th class="px-4 sm:px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider w-1/4 border-r border-slate-700">MAPPOOL</th>
                                        <th class="px-2 sm:px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center border-r border-slate-700 w-1/4">RUN 1</th>
                                        <th class="px-2 sm:px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center border-r border-slate-700 w-1/4">RUN 2</th>
                                        <th class="px-2 sm:px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center w-1/4">RUN 3</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 sm:p-6 bg-slate-900 border-t border-slate-700 flex justify-end">
                            <button type="submit" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 transition duration-200 flex items-center justify-center">
                                Save Scores
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderAdmin() {
            const players = state.players.filter(p => p.role === 'player');
            let playerRows = players.map(p => `
                <tr class="border-b border-slate-700 hover:bg-slate-700/50 transition">
                    <td class="px-4 py-3 whitespace-nowrap font-medium text-white">${p.username}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-right">
                        <button onclick="window.removePlayer('${p.id}')" class="text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 px-3 py-1 rounded transition text-sm">
                            <i class="fa-solid fa-trash mr-1"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            if (players.length === 0) playerRows = `<tr><td colspan="2" class="px-4 py-6 text-center text-slate-500">Tidak ada player terdaftar.</td></tr>`;

            const currentAdminStage = state.adminStage || 'Qualifier';
            const filteredBeatmaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === currentAdminStage);

            let beatmapRows = filteredBeatmaps.map(b => {
                let badgeColor = 'bg-slate-600 text-white';
                if(b.mod === 'NM') badgeColor = 'bg-emerald-400 text-emerald-950';
                if(b.mod === 'HD') badgeColor = 'bg-amber-500 text-amber-950';
                if(b.mod === 'HR') badgeColor = 'bg-red-500 text-white';
                if(b.mod === 'DT') badgeColor = 'bg-sky-400 text-sky-950';
                if(b.mod === 'MM') badgeColor = 'bg-purple-500 text-white';
                if(b.mod === 'TB') badgeColor = 'bg-[#d9d9d9] text-slate-900';

                return `
                <tr class="border-b border-slate-700 hover:bg-slate-700/50 transition">
                    <td class="px-4 py-3 whitespace-nowrap text-white flex items-center">
                        <span class="bg-slate-700 border border-slate-600 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded mr-2 uppercase tracking-wider">${b.stage || 'Qualifier'}</span>
                        <span class="${badgeColor} text-xs font-bold px-2 py-1 rounded mr-2">${b.mod}</span>
                        <span class="font-medium">${b.name}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-right">
                        <button onclick="window.removeBeatmap('${b.id}')" class="text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 px-3 py-1 rounded transition text-sm">
                            <i class="fa-solid fa-trash mr-1"></i>
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
            if (filteredBeatmaps.length === 0) beatmapRows = `<tr><td colspan="2" class="px-4 py-6 text-center text-slate-500">Tidak ada beatmap terdaftar di stage ini.</td></tr>`;

            return `
                <div class="fade-in w-full">
                    <h2 class="text-2xl sm:text-3xl font-bold text-white mb-6 sm:mb-8 text-center sm:text-left">Admin Dashboard</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                        
                        <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden flex flex-col">
                            <div class="p-4 sm:p-6 bg-slate-900 border-b border-slate-700">
                                <h3 class="text-lg sm:text-xl font-bold text-brand-400 flex items-center">
                                    <i class="fa-solid fa-users mr-3"></i> Manage Players
                                </h3>
                            </div>
                            <div class="p-4 border-b border-slate-700">
                                <form onsubmit="event.preventDefault(); window.addPlayer(this.username.value, this.password.value); this.reset();" class="flex gap-2">
                                    <input type="text" name="username" required placeholder="Username" class="min-w-0 flex-1 bg-slate-900 border border-slate-600 text-white rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:border-brand-500">
                                    <input type="password" name="password" required placeholder="Password" class="min-w-0 flex-1 bg-slate-900 border border-slate-600 text-white rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:border-brand-500">
                                    <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white px-3 py-2 rounded-lg transition font-medium whitespace-nowrap flex-shrink-0 text-sm">
                                        <i class="fa-solid fa-plus mr-1"></i> Add
                                    </button>
                                </form>
                            </div>
                            <div class="flex-grow overflow-auto max-h-96 custom-scrollbar">
                                <table class="w-full">
                                    <tbody class="divide-y divide-slate-700">${playerRows}</tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden flex flex-col">
                            <div class="p-4 sm:p-6 bg-slate-900 border-b border-slate-700">
                                <h3 class="text-lg sm:text-xl font-bold text-emerald-400 flex items-center">
                                    <i class="fa-solid fa-music mr-3"></i> Manage Mappool
                                </h3>
                            </div>
                            <div class="p-4 border-b border-slate-700">
                                <form onsubmit="event.preventDefault(); window.addBeatmap(this.mapStage.value, this.mapMod.value);" class="flex gap-2 w-fit">
                                    <select name="mapStage" required onchange="window.changeAdminStage(this.value)" class="bg-slate-900 border border-slate-600 text-white rounded-lg px-2.5 py-2 focus:outline-none focus:border-emerald-500 w-[140px] text-sm">
                                        <option value="Qualifier" ${state.adminStage === 'Qualifier' ? 'selected' : ''}>Qualifier</option>
                                        <option value="RO32" ${state.adminStage === 'RO32' ? 'selected' : ''}>RO32</option>
                                        <option value="RO16" ${state.adminStage === 'RO16' ? 'selected' : ''}>RO16</option>
                                        <option value="Semi Final" ${state.adminStage === 'Semi Final' ? 'selected' : ''}>Semi Final</option>
                                        <option value="Final" ${state.adminStage === 'Final' ? 'selected' : ''}>Final</option>
                                        <option value="Grand Final" ${state.adminStage === 'Grand Final' ? 'selected' : ''}>Grand Final</option>
                                    </select>
                                    <select name="mapMod" required onchange="window.changeAdminMod(this.value)" class="bg-slate-900 border border-slate-600 text-white rounded-lg px-2.5 py-2 focus:outline-none focus:border-emerald-500 w-[80px] text-center text-sm">
                                        <option value="NM" ${state.adminMod === 'NM' ? 'selected' : ''}>NM</option>
                                        <option value="HD" ${state.adminMod === 'HD' ? 'selected' : ''}>HD</option>
                                        <option value="HR" ${state.adminMod === 'HR' ? 'selected' : ''}>HR</option>
                                        <option value="DT" ${state.adminMod === 'DT' ? 'selected' : ''}>DT</option>
                                        <option value="MM" ${state.adminMod === 'MM' ? 'selected' : ''}>MM</option>
                                        <option value="TB" ${state.adminMod === 'TB' ? 'selected' : ''}>TB</option>
                                    </select>
                                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg transition font-medium whitespace-nowrap text-sm">
                                        <i class="fa-solid fa-plus mr-1"></i> Add
                                    </button>
                                </form>
                            </div>
                            <div class="flex-grow overflow-auto max-h-96 custom-scrollbar">
                                <table class="w-full">
                                    <tbody class="divide-y divide-slate-700">${beatmapRows}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const appDiv = document.getElementById('app');
            
            if (!state.currentUser) {
                appDiv.innerHTML = renderLogin();
                return;
            }

            let viewContent = '';
            switch (state.view) {
                case 'leaderboard': viewContent = renderLeaderboard(); break;
                case 'submit': viewContent = renderSubmitScore(); break;
                case 'admin':
                    if (state.currentUser.role === 'admin') viewContent = renderAdmin();
                    else { state.view = 'leaderboard'; viewContent = renderLeaderboard(); }
                    break;
                default: viewContent = renderLeaderboard();
            }

            appDiv.innerHTML = `
                ${renderNavbar()}
                <main class="flex-grow pb-10 w-full">${viewContent}</main>
            `;
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            if (!API_URL) {
                state.players = [
                    { id: 'admin1', username: 'admin', password: 'admin', role: 'admin' },
                    { id: 'p1', username: 'faker', password: '123', role: 'player' }
                ];
                const initialMaps = [
                    { id: 'nm1', stage: 'Qualifier', mod: 'NM', name: 'NM1' }, { id: 'nm2', stage: 'Qualifier', mod: 'NM', name: 'NM2' }, { id: 'nm3', stage: 'Qualifier', mod: 'NM', name: 'NM3' }, { id: 'nm4', stage: 'Qualifier', mod: 'NM', name: 'NM4' },
                    { id: 'hd1', stage: 'Qualifier', mod: 'HD', name: 'HD1' }, { id: 'hd2', stage: 'Qualifier', mod: 'HD', name: 'HD2' }, { id: 'hd3', stage: 'Qualifier', mod: 'HD', name: 'HD3' },
                    { id: 'hr1', stage: 'Qualifier', mod: 'HR', name: 'HR1' }, { id: 'hr2', stage: 'Qualifier', mod: 'HR', name: 'HR2' }, { id: 'hr3', stage: 'Qualifier', mod: 'HR', name: 'HR3' },
                    { id: 'dt1', stage: 'Qualifier', mod: 'DT', name: 'DT1' }, { id: 'dt2', stage: 'Qualifier', mod: 'DT', name: 'DT2' }, { id: 'dt3', stage: 'Qualifier', mod: 'DT', name: 'DT3' },
                    { id: 'mm1', stage: 'Qualifier', mod: 'MM', name: 'MM1' }, { id: 'mm2', stage: 'Qualifier', mod: 'MM', name: 'MM2' }, { id: 'tb1', stage: 'Qualifier', mod: 'TB', name: 'TB1' }
                ];
                state.beatmaps = initialMaps;
            } else {
                fetchDatabase();
            }
            renderApp();
        });
    </script>
</body>
</html>
