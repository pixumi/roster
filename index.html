<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Roster & Leaderboard</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#8b5cf6', // Violet 500
                            600: '#7c3aed', // Violet 600
                            900: '#4c1d95', // Violet 900
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col items-end pointer-events-none"></div>

    <!-- Main App Container -->
    <!-- Max-w diubah ke 7xl agar UI admin dashboard/tabel score melebar tidak memotong tombol -->
    <div id="app" class="flex-grow flex flex-col w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-slate-500 text-sm mt-auto">
        <p>&copy; 2026 Tournament Roster. Powered by HTML, CSS, & JS.</p>
    </footer>

    <script>
        // --- KONFIGURASI CLOUDFLARE WORKER API ---
        const API_URL = "https://roster-api.team-id.workers.dev";

        // --- GLOBAL STATE ---
        const state = {
            currentUser: null,
            view: 'login', // 'login', 'leaderboard', 'submit', 'admin'
            currentStage: 'Qualifier', // State untuk dropdown Stage (Leaderboard & Submit)
            adminStage: 'Qualifier', // State untuk dropdown Stage di Admin Panel
            players: [],
            beatmaps: [],
            scores: [] 
        };

        let isOnline = false;

        // --- UTILITIES ---
        window.generateId = function() { return Math.random().toString(36).substr(2, 9); }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgColor = 'bg-blue-600';
            let icon = '<i class="fa-solid fa-circle-info mr-2"></i>';
            if (type === 'error') { bgColor = 'bg-red-600'; icon = '<i class="fa-solid fa-circle-exclamation mr-2"></i>'; } 
            else if (type === 'success') { bgColor = 'bg-green-600'; icon = '<i class="fa-solid fa-circle-check mr-2"></i>'; } 
            else if (type === 'warning') { bgColor = 'bg-yellow-600'; icon = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>'; }
            toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-xl mb-3 flex items-center transition-all duration-300 opacity-0 transform translate-x-10 pointer-events-auto z-50`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-x-10'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.changeStage = function(stage) {
            state.currentStage = stage;
            renderApp();
        }

        window.changeAdminStage = function(stage) {
            state.adminStage = stage;
            renderApp();
        }

        // --- DATABASE FETCH (CLOUDFLARE) ---
        async function fetchDatabase() {
            if (!API_URL) return; 
            try {
                const response = await fetch(`${API_URL}/data`);
                if(response.ok) {
                    const data = await response.json();
                    state.players = data.players || [];
                    state.beatmaps = data.beatmaps || [];
                    state.scores = data.scores || [];
                    
                    const modOrder = {'NM':1, 'HD':2, 'HR':3, 'DT':4, 'MM':5, 'TB':6};
                    state.beatmaps.sort((a,b) => modOrder[a.mod] - modOrder[b.mod] || a.name.localeCompare(b.name));
                    
                    isOnline = true;
                    renderApp();
                }
            } catch (error) {
                console.error("Gagal mengambil data dari Worker:", error);
                isOnline = false;
            }
        }

        // --- ACTIONS ---
        window.login = function(username, password) {
            const user = state.players.find(p => p.username === username && p.password === password);
            if (user) {
                state.currentUser = user;
                state.view = 'leaderboard';
                showToast(`Selamat datang, ${user.username}!`, 'success');
                renderApp();
            } else {
                showToast('Username atau password salah!', 'error');
            }
        }

        window.logout = function() {
            state.currentUser = null;
            state.view = 'login';
            showToast('Anda telah logout.', 'info');
            renderApp();
        }

        window.navigate = function(viewName) {
            state.view = viewName;
            renderApp();
        }

        window.addPlayer = async function(username, password) {
            if (state.players.some(p => p.username === username)) {
                showToast('Username sudah digunakan!', 'error'); return;
            }
            if(API_URL) {
                await fetch(`${API_URL}/players`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({username, password}) 
                });
                await fetchDatabase();
            } else {
                state.players.push({ id: window.generateId(), username, password, role: 'player' });
                renderApp();
            }
            showToast('Player berhasil ditambahkan!', 'success');
        }

        window.removePlayer = async function(playerId) {
            if(API_URL) {
                await fetch(`${API_URL}/players?id=${playerId}`, { method: 'DELETE' });
                await fetchDatabase();
            } else {
                state.players = state.players.filter(p => p.id !== playerId);
                state.scores = state.scores.filter(s => s.player_id !== playerId);
                renderApp();
            }
            showToast('Player berhasil dihapus!', 'success');
        }

        window.addBeatmap = async function(stage, mod, name) {
            if (!name.trim()) return showToast('Nama beatmap tidak boleh kosong!', 'error');
            if(API_URL) {
                await fetch(`${API_URL}/beatmaps`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({stage, mod, name}) 
                });
                await fetchDatabase();
            } else {
                state.beatmaps.push({ id: window.generateId(), stage, mod, name });
                const modOrder = {'NM':1, 'HD':2, 'HR':3, 'DT':4, 'MM':5, 'TB':6};
                state.beatmaps.sort((a,b) => modOrder[a.mod] - modOrder[b.mod] || a.name.localeCompare(b.name));
                renderApp();
            }
            showToast(`Beatmap berhasil ditambahkan ke ${stage}!`, 'success');
        }

        window.removeBeatmap = async function(beatmapId) {
            if(API_URL) {
                await fetch(`${API_URL}/beatmaps?id=${beatmapId}`, { method: 'DELETE' });
                await fetchDatabase();
            } else {
                state.beatmaps = state.beatmaps.filter(b => b.id !== beatmapId);
                renderApp();
            }
            showToast('Beatmap berhasil dihapus!', 'success');
        }

        window.validateScore = function(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val.length > 0) {
                if (val.startsWith('1')) {
                    if (val.length > 7) val = val.slice(0, 7);
                    // UPDATE: Maximum 1300000
                    if (parseInt(val) > 1300000) val = '1300000';
                } else {
                    if (val.length > 6) val = val.slice(0, 6);
                }
            }
            input.value = val;
        }

        // UPDATE: saveScores sekarang mengirim data secara batch
        window.saveScores = async function(event, form) {
            event.preventDefault();
            const formData = new FormData(form);
            let added = 0;
            let batchData = [];

            for (let [key, value] of formData.entries()) {
                if (!value || value.trim() === '') continue;
                const score = Number(value);
                if (isNaN(score) || score <= 0) continue;

                const mapKey = key.replace('score_', ''); 

                if(API_URL) {
                    batchData.push({ player_id: state.currentUser.id, map_key: mapKey, score: score });
                } else {
                    const existingIdx = state.scores.findIndex(
                        s => s.player_id === state.currentUser.id && s.map_key === mapKey
                    );
                    if (existingIdx !== -1) {
                        state.scores[existingIdx].score = score;
                    } else {
                        state.scores.push({
                            id: window.generateId(),
                            player_id: state.currentUser.id,
                            map_key: mapKey,
                            score: score
                        });
                    }
                }
                added++;
            }
            
            if (added > 0) {
                if(API_URL) {
                    // Kirim semua skor dalam 1 fetch request
                    await fetch(`${API_URL}/scores/batch`, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(batchData) 
                    });
                    await fetchDatabase();
                }
                showToast(`Tersimpan: ${added} input skor Run ditambahkan.`, 'success');
                window.navigate('leaderboard');
            } else {
                showToast('Tidak ada skor valid yang diinput.', 'warning');
            }
        }

        // --- DATA PROCESSING ---
        function getLeaderboardData(currentStageMaps) {
            const playerList = state.players.filter(p => p.role === 'player');
            const mapStats = {}; 
            
            currentStageMaps.forEach(map => {
                const subMods = map.mod === 'MM' ? ['NM', 'HD', 'HR'] : [null];
                subMods.forEach(subMod => {
                    const mapBaseKey = subMod ? `${map.id}_${subMod}` : map.id;
                    mapStats[mapBaseKey] = [];
                    
                    playerList.forEach(player => {
                        let sum = 0;
                        let count = 0;
                        
                        // Menarik data skor dari Run 1, 2, dan 3
                        for(let r=1; r<=3; r++) {
                            const exactKey = subMod ? `${map.id}_${r}_${subMod}` : `${map.id}_${r}`;
                            const playerRuns = state.scores.filter(s => s.player_id === player.id && s.map_key === exactKey);
                            if (playerRuns.length > 0) {
                                // Ambil skor submission yang terbaru (jika disubmit berkali-kali)
                                sum += playerRuns[playerRuns.length - 1].score; 
                                count++;
                            }
                        }
                        
                        let avg = null;
                        if (count > 0) {
                            avg = Math.round(sum / count);
                        }

                        if (avg !== null) {
                            mapStats[mapBaseKey].push({ playerId: player.id, average: avg });
                        }
                    });
                    
                    mapStats[mapBaseKey].sort((a, b) => b.average - a.average);
                });
            });

            const rankings = playerList.map(player => {
                let sumPlacements = 0;
                let sumScores = 0;
                let mapsPlayed = 0;
                const mapAverages = {}; 
                const mapRanks = {};
                
                Object.keys(mapStats).forEach(mapKey => {
                    const mapRanking = mapStats[mapKey];
                    const playerRankIndex = mapRanking.findIndex(p => p.playerId === player.id);
                    
                    if (playerRankIndex !== -1) {
                        const rank = playerRankIndex + 1; 
                        sumPlacements += rank;
                        sumScores += mapRanking[playerRankIndex].average;
                        mapsPlayed++;
                        mapAverages[mapKey] = mapRanking[playerRankIndex].average;
                        mapRanks[mapKey] = rank;
                    } else {
                        mapAverages[mapKey] = null;
                        mapRanks[mapKey] = null;
                    }
                });
                
                const avgRank = mapsPlayed > 0 ? (sumPlacements / mapsPlayed) : 999; 
                const avgScore = mapsPlayed > 0 ? Math.round(sumScores / mapsPlayed) : 0;
                
                return {
                    id: player.id, username: player.username,
                    avgRank, avgScore, mapAverages, mapRanks, mapsPlayed
                };
            });

            rankings.sort((a, b) => {
                if (a.avgRank !== b.avgRank) return a.avgRank - b.avgRank;
                return b.avgScore - a.avgScore; 
            });

            return { rankings, mapStats };
        }

        // --- UI RENDERING COMPONENTS ---
        function renderNavbar() {
            if (!state.currentUser) return '';
            const navLinks = `
                <button onclick="window.navigate('leaderboard')" class="${state.view === 'leaderboard' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition mx-2 py-2">
                    <i class="fa-solid fa-trophy mr-1"></i> Leaderboard
                </button>
                ${state.currentUser.role === 'player' ? `
                    <button onclick="window.navigate('submit')" class="${state.view === 'submit' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition mx-2 py-2">
                        <i class="fa-solid fa-upload mr-1"></i> Submit Score
                    </button>
                ` : ''}
                ${state.currentUser.role === 'admin' ? `
                    <button onclick="window.navigate('admin')" class="${state.view === 'admin' ? 'text-brand-400 font-bold' : 'text-slate-300 hover:text-white'} transition mx-2 py-2">
                        <i class="fa-solid fa-gear mr-1"></i> Manage
                    </button>
                ` : ''}
            `;

            return `
                <nav class="bg-slate-800 border-b border-slate-700 py-4 mb-8 rounded-b-xl shadow-lg">
                    <div class="flex flex-col sm:flex-row justify-between items-center px-6">
                        <div class="text-xl font-bold tracking-wider text-brand-500 mb-4 sm:mb-0 flex items-center">
                            <i class="fa-solid fa-gamepad mr-2"></i>ROSTER GENERATOR
                            ${API_URL === '' ? '<span class="text-xs bg-yellow-500/20 text-yellow-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-triangle-exclamation"></i> Offline Mode</span>' : 
                            (isOnline ? '<span class="text-xs bg-green-500/20 text-green-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-cloud"></i> Online</span>' : '<span class="text-xs bg-red-500/20 text-red-500 px-2 py-1 rounded-full ml-3"><i class="fa-solid fa-cloud-arrow-down"></i> Error</span>')}
                        </div>
                        <div class="flex items-center gap-2 sm:gap-6">
                            ${navLinks}
                        </div>
                        <div class="mt-4 sm:mt-0 flex items-center bg-slate-700 px-4 py-2 rounded-full">
                            <i class="fa-solid fa-user-circle text-xl text-slate-300 mr-2"></i>
                            <span class="mr-4 font-medium">${state.currentUser.username} <span class="text-xs text-brand-400">(${state.currentUser.role})</span></span>
                            <button onclick="window.logout()" class="text-red-400 hover:text-red-300 transition" title="Logout">
                                <i class="fa-solid fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in pt-10">
                    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
                        <div class="text-center mb-8">
                            <i class="fa-solid fa-gamepad text-5xl text-brand-500 mb-3"></i>
                            <h2 class="text-3xl font-bold">Roster Generator</h2>
                                <br>
                                <br>

                        <form onsubmit="event.preventDefault(); window.login(this.username.value, this.password.value);" class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-user"></i></div>
                                    <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" placeholder="Masukkan username">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><i class="fa-solid fa-lock"></i></div>
                                    <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" placeholder="Masukkan password">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-brand-500/30 transition duration-200">
                                Login Sekarang
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderLeaderboard() {
            const currentStageMaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === state.currentStage);
            const data = getLeaderboardData(currentStageMaps);
            
            let mapHeaders = '';
            currentStageMaps.forEach(map => {
                if (map.mod === 'MM') {
                    mapHeaders += `
                        <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} NM</th>
                        <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} HD</th>
                        <th class="px-4 py-3 text-xs font-bold text-white bg-purple-500 uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name} HR</th>
                    `;
                } else {
                    let bgColor = 'bg-slate-700'; let textColor = 'text-white';
                    if(map.mod === 'NM') { bgColor = 'bg-emerald-400'; textColor = 'text-emerald-950'; }
                    if(map.mod === 'HD') { bgColor = 'bg-amber-500'; textColor = 'text-amber-950'; }
                    if(map.mod === 'HR') { bgColor = 'bg-red-500'; textColor = 'text-white'; }
                    if(map.mod === 'DT') { bgColor = 'bg-sky-400'; textColor = 'text-sky-950'; }
                    if(map.mod === 'TB') { bgColor = 'bg-slate-400'; textColor = 'text-slate-900'; }
                    
                    mapHeaders += `<th class="px-4 py-3 text-sm font-extrabold ${textColor} ${bgColor} uppercase tracking-wider text-center border-l border-slate-800 min-w-[120px] shadow-inner">${map.name}</th>`;
                }
            });

            let rows = data.rankings.map((player, index) => {
                let mapCells = '';
                currentStageMaps.forEach(map => {
                    const subMods = map.mod === 'MM' ? ['NM', 'HD', 'HR'] : [null];
                    subMods.forEach(subMod => {
                        const mapKey = subMod ? `${map.id}_${subMod}` : map.id;
                        const avg = player.mapAverages[mapKey];
                        const rank = player.mapRanks[mapKey];
                        
                        let cellClass = "px-3 py-2 whitespace-nowrap font-mono text-sm border-l border-slate-700/50 hover:bg-slate-700/80 transition ";
                        
                        if (avg !== null) {
                            let rankColor = 'text-slate-500'; let scoreColor = 'text-slate-300';
                            
                            if (rank === 1) { rankColor = 'text-yellow-400 font-bold'; scoreColor = 'text-yellow-400 font-bold'; } 
                            else if (rank === 2) { rankColor = 'text-slate-300 font-bold'; scoreColor = 'text-slate-100 font-bold'; } 
                            else if (rank === 3) { rankColor = 'text-amber-600 font-bold'; scoreColor = 'text-amber-500 font-bold'; }
                            
                            mapCells += `<td class="${cellClass}">
                                <div class="flex justify-between items-center w-full gap-2">
                                    <span class="text-xs ${rankColor} w-6 text-left">#${rank}</span>
                                    <span class="${scoreColor} flex-1 text-right">${avg.toLocaleString()}</span>
                                </div>
                            </td>`;
                        } else {
                            mapCells += `<td class="${cellClass} text-center text-slate-600 font-medium">-</td>`;
                        }
                    });
                });

                return `
                    <tr class="bg-slate-800 border-b border-slate-700/50 hover:bg-slate-750 transition">
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-bold text-slate-300 w-12 text-center sticky left-0 bg-slate-800 z-10 border-r border-slate-700/50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">#${index + 1}</td>
                        <td class="px-4 py-2 whitespace-nowrap font-bold text-white text-base sticky left-[48px] bg-slate-800 z-10 border-r border-slate-700/50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">${player.username}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-center font-bold text-white bg-slate-900/40">${player.avgRank === 999 ? '-' : player.avgRank.toFixed(2)}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-center font-medium text-slate-300 bg-slate-900/40">${player.avgScore.toLocaleString()}</td>
                        ${mapCells}
                    </tr>
                `;
            }).join('');

            if (data.rankings.length === 0) rows = `<tr><td colspan="100%" class="px-6 py-8 text-center text-slate-500">Belum ada data pemain.</td></tr>`;

            return `
                <div class="fade-in w-full">
                    <div class="flex flex-col mb-5">
                        <select onchange="window.changeStage(this.value)" class="bg-transparent text-3xl font-bold text-white mb-1 uppercase tracking-tight appearance-none cursor-pointer hover:text-brand-400 transition focus:outline-none w-fit">
                            <option value="Qualifier" class="bg-slate-900 text-base" ${state.currentStage === 'Qualifier' ? 'selected' : ''}>QUALIFIER - PLAYER SCORES ▾</option>
                            <option value="RO32" class="bg-slate-900 text-base" ${state.currentStage === 'RO32' ? 'selected' : ''}>RO32 - PLAYER SCORES ▾</option>
                            <option value="RO16" class="bg-slate-900 text-base" ${state.currentStage === 'RO16' ? 'selected' : ''}>RO16 - PLAYER SCORES ▾</option>
                            <option value="Semi Final" class="bg-slate-900 text-base" ${state.currentStage === 'Semi Final' ? 'selected' : ''}>SEMI FINAL - PLAYER SCORES ▾</option>
                            <option value="Final" class="bg-slate-900 text-base" ${state.currentStage === 'Final' ? 'selected' : ''}>FINAL - PLAYER SCORES ▾</option>
                            <option value="Grand Final" class="bg-slate-900 text-base" ${state.currentStage === 'Grand Final' ? 'selected' : ''}>GRAND FINAL - PLAYER SCORES ▾</option>
                        </select>
                        <p class="text-slate-400 text-sm">Peringkat didasarkan pada <b class="text-slate-200">Avg. Sum of Placements</b> terkecil di stage ini.</p>
                    </div>
                    
                    <div class="bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden w-full relative">
                        <div class="overflow-x-auto custom-scrollbar pb-2">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-900">
                                    <tr>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center sticky left-0 bg-slate-900 z-20 border-r border-slate-700 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">#</th>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider sticky left-[48px] bg-slate-900 z-20 border-r border-slate-700 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)] min-w-[150px]">Player</th>
                                        <th class="px-4 py-4 text-xs font-bold text-white bg-slate-800 uppercase tracking-wider text-center whitespace-nowrap">Avg. <i class="fa-solid fa-sort-down align-top ml-1 text-brand-400"></i></th>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-300 bg-slate-800 uppercase tracking-wider text-center whitespace-nowrap border-r border-slate-700">Avg. Score</th>
                                        ${mapHeaders}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700">
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSubmitScore() {
            const currentStageMaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === state.currentStage);
            const modOrder = ['NM', 'HD', 'HR', 'DT', 'MM', 'TB'];
            let tableRows = '';

            // Helper untuk memanggil data yang tersimpan agar tampil kembali di form
            function getScoreValue(mapId, run, subMod = null) {
                const exactKey = subMod ? `${mapId}_${run}_${subMod}` : `${mapId}_${run}`;
                const runs = state.scores.filter(s => s.player_id === state.currentUser.id && s.map_key === exactKey);
                return runs.length > 0 ? runs[runs.length - 1].score : '';
            }

            modOrder.forEach(mod => {
                const maps = currentStageMaps.filter(b => b.mod === mod);
                if (maps.length === 0) return;

                let modColor = 'text-white';
                if(mod === 'NM') modColor = 'text-emerald-400';
                if(mod === 'HD') modColor = 'text-amber-500';
                if(mod === 'HR') modColor = 'text-red-500';
                if(mod === 'DT') modColor = 'text-sky-400';
                if(mod === 'MM') modColor = 'text-purple-500';
                if(mod === 'TB') modColor = 'text-slate-400';

                tableRows += `
                    <tr class="bg-slate-900 border-b border-slate-700">
                        <td colspan="4" class="px-6 py-3 font-bold ${modColor} text-lg">
                            <i class="fa-solid fa-layer-group mr-2"></i> ${mod} Pool
                        </td>
                    </tr>
                `;

                maps.forEach(map => {
                    if (mod === 'MM') {
                        let runCols = '';
                        for(let r=1; r<=3; r++){
                            runCols += `
                                <td class="px-2 py-3 border-r border-slate-700/50 align-top">
                                    <div class="flex flex-col gap-2 items-center w-full max-w-[90px] mx-auto">
                                        <div class="flex items-center justify-between w-full">
                                            <span class="text-[10px] font-bold text-emerald-400">NM</span>
                                            <input type="text" name="score_${map.id}_${r}_NM" value="${getScoreValue(map.id, r, 'NM')}" oninput="window.validateScore(this)" class="w-16 bg-slate-900 border border-slate-600 text-white rounded px-1 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs text-center" placeholder="0">
                                        </div>
                                        <div class="flex items-center justify-between w-full">
                                            <span class="text-[10px] font-bold text-amber-500">HD</span>
                                            <input type="text" name="score_${map.id}_${r}_HD" value="${getScoreValue(map.id, r, 'HD')}" oninput="window.validateScore(this)" class="w-16 bg-slate-900 border border-slate-600 text-white rounded px-1 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs text-center" placeholder="0">
                                        </div>
                                        <div class="flex items-center justify-between w-full">
                                            <span class="text-[10px] font-bold text-red-500">HR</span>
                                            <input type="text" name="score_${map.id}_${r}_HR" value="${getScoreValue(map.id, r, 'HR')}" oninput="window.validateScore(this)" class="w-16 bg-slate-900 border border-slate-600 text-white rounded px-1 py-1.5 focus:outline-none focus:border-brand-500 font-mono text-xs text-center" placeholder="0">
                                        </div>
                                    </div>
                                </td>
                            `;
                        }
                        tableRows += `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                <td class="px-6 py-4 font-medium text-slate-200 border-r border-slate-700/50 w-1/4">
                                    ${map.name}
                                    <div class="text-[10px] text-slate-500 mt-1 font-normal leading-tight">Pilih salah satu mod per run</div>
                                </td>
                                ${runCols}
                            </tr>
                        `;
                    } else {
                        let runCols = '';
                        for(let r=1; r<=3; r++){
                            runCols += `
                                <td class="px-3 py-4 border-r border-slate-700/50">
                                    <div class="relative w-full max-w-[120px] mx-auto">
                                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-500 font-bold text-xs">#</div>
                                        <input type="text" name="score_${map.id}_${r}" value="${getScoreValue(map.id, r)}" oninput="window.validateScore(this)" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-6 pr-2 py-2 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 font-mono text-sm text-left" placeholder="0">
                                    </div>
                                </td>
                            `;
                        }
                        tableRows += `
                            <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                <td class="px-6 py-4 font-medium text-slate-200 border-r border-slate-700/50 w-1/4">${map.name}</td>
                                ${runCols}
                            </tr>
                        `;
                    }
                });
            });

            if (tableRows === '') {
                tableRows = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Belum ada map terdaftar di stage ini.</td></tr>`;
            }

            return `
                <div class="fade-in max-w-5xl mx-auto w-full">
                    <div class="flex flex-col mb-6">
                        <select onchange="window.changeStage(this.value)" class="bg-transparent text-3xl font-bold text-white mb-1 appearance-none cursor-pointer hover:text-brand-400 transition focus:outline-none w-fit">
                            <option value="Qualifier" class="bg-slate-900 text-base" ${state.currentStage === 'Qualifier' ? 'selected' : ''}>Form Submission: QUALIFIER ▾</option>
                            <option value="RO32" class="bg-slate-900 text-base" ${state.currentStage === 'RO32' ? 'selected' : ''}>Form Submission: RO32 ▾</option>
                            <option value="RO16" class="bg-slate-900 text-base" ${state.currentStage === 'RO16' ? 'selected' : ''}>Form Submission: RO16 ▾</option>
                            <option value="Semi Final" class="bg-slate-900 text-base" ${state.currentStage === 'Semi Final' ? 'selected' : ''}>Form Submission: SEMI FINAL ▾</option>
                            <option value="Final" class="bg-slate-900 text-base" ${state.currentStage === 'Final' ? 'selected' : ''}>Form Submission: FINAL ▾</option>
                            <option value="Grand Final" class="bg-slate-900 text-base" ${state.currentStage === 'Grand Final' ? 'selected' : ''}>Form Submission: GRAND FINAL ▾</option>
                        </select>
                        <p class="text-slate-400 text-sm">Isi skor pada map yang dimainkan. Run 1, 2, dan 3 akan dihitung <b>rata-ratanya</b>.</p>
                    </div>
                    
                    <form onsubmit="window.saveScores(event, this)" class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead class="bg-slate-900">
                                    <tr>
                                        <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider w-1/4 border-r border-slate-700">Map ID</th>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center border-r border-slate-700 w-1/4">RUN 1</th>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center border-r border-slate-700 w-1/4">RUN 2</th>
                                        <th class="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center w-1/4">RUN 3</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                        <div class="p-6 bg-slate-900 border-t border-slate-700 flex justify-end">
                            <button type="submit" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 transition duration-200 flex items-center justify-center">
                                <i class="fa-solid fa-paper-plane mr-2"></i> Save Scores
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderAdmin() {
            const players = state.players.filter(p => p.role === 'player');
            let playerRows = players.map(p => `
                <tr class="border-b border-slate-700 hover:bg-slate-700/50 transition">
                    <td class="px-4 py-3 whitespace-nowrap font-medium text-white">${p.username}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-right">
                        <button onclick="window.removePlayer('${p.id}')" class="text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 px-3 py-1 rounded transition text-sm">
                            <i class="fa-solid fa-trash mr-1"></i> Hapus
                        </button>
                    </td>
                </tr>
            `).join('');
            if (players.length === 0) playerRows = `<tr><td colspan="2" class="px-4 py-6 text-center text-slate-500">Tidak ada player terdaftar.</td></tr>`;

            const currentAdminStage = state.adminStage || 'Qualifier';
            const filteredBeatmaps = state.beatmaps.filter(b => (b.stage || 'Qualifier') === currentAdminStage);

            let beatmapRows = filteredBeatmaps.map(b => {
                let badgeColor = 'bg-slate-600 text-white';
                if(b.mod === 'NM') badgeColor = 'bg-emerald-400 text-emerald-950';
                if(b.mod === 'HD') badgeColor = 'bg-amber-500 text-amber-950';
                if(b.mod === 'HR') badgeColor = 'bg-red-500 text-white';
                if(b.mod === 'DT') badgeColor = 'bg-sky-400 text-sky-950';
                if(b.mod === 'MM') badgeColor = 'bg-purple-500 text-white';
                if(b.mod === 'TB') badgeColor = 'bg-slate-400 text-slate-900';

                return `
                <tr class="border-b border-slate-700 hover:bg-slate-700/50 transition">
                    <td class="px-4 py-3 whitespace-nowrap text-white flex items-center">
                        <span class="bg-slate-700 border border-slate-600 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded mr-2 uppercase tracking-wider">${b.stage || 'Qualifier'}</span>
                        <span class="${badgeColor} text-xs font-bold px-2 py-1 rounded mr-2">${b.mod}</span>
                        <span class="font-medium">${b.name}</span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-right">
                        <button onclick="window.removeBeatmap('${b.id}')" class="text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 px-3 py-1 rounded transition text-sm">
                            <i class="fa-solid fa-trash mr-1"></i>
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
            if (filteredBeatmaps.length === 0) beatmapRows = `<tr><td colspan="2" class="px-4 py-6 text-center text-slate-500">Tidak ada beatmap terdaftar di stage ini.</td></tr>`;

            return `
                <div class="fade-in w-full">
                    <h2 class="text-3xl font-bold text-white mb-8">Admin Dashboard</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        
                        <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden flex flex-col">
                            <div class="p-6 bg-slate-900 border-b border-slate-700">
                                <h3 class="text-xl font-bold text-brand-400 flex items-center">
                                    <i class="fa-solid fa-users mr-3"></i> Manage Players
                                </h3>
                            </div>
                            <div class="p-6 border-b border-slate-700">
                                <form onsubmit="event.preventDefault(); window.addPlayer(this.username.value, this.password.value); this.reset();" class="flex gap-2">
                                    <input type="text" name="username" required placeholder="Username Player" class="flex-1 bg-slate-900 border border-slate-600 text-white rounded-lg px-3 py-2 focus:outline-none focus:border-brand-500">
                                    <input type="password" name="password" required placeholder="Password" class="flex-1 bg-slate-900 border border-slate-600 text-white rounded-lg px-3 py-2 focus:outline-none focus:border-brand-500">
                                    <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white px-3 py-2 rounded-lg transition font-medium whitespace-nowrap flex-shrink-0">
                                        <i class="fa-solid fa-plus mr-1"></i> Add
                                    </button>
                                </form>
                            </div>
                            <div class="flex-grow overflow-auto max-h-96 custom-scrollbar">
                                <table class="w-full">
                                    <tbody class="divide-y divide-slate-700">${playerRows}</tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden flex flex-col">
                            <div class="p-6 bg-slate-900 border-b border-slate-700">
                                <h3 class="text-xl font-bold text-emerald-400 flex items-center">
                                    <i class="fa-solid fa-music mr-3"></i> Manage Mappool
                                </h3>
                            </div>
                            <div class="p-4 border-b border-slate-700">
                                <form onsubmit="event.preventDefault(); window.addBeatmap(this.mapStage.value, this.mapMod.value, this.mapName.value); this.reset();" class="flex flex-col sm:flex-row gap-2 sm:gap-3">
                                    <select name="mapStage" required onchange="window.changeAdminStage(this.value)" class="bg-slate-900 border border-slate-600 text-white rounded-lg px-2 py-2 focus:outline-none focus:border-emerald-500 w-full sm:w-24 flex-shrink-0">
                                        <option value="Qualifier" ${currentAdminStage === 'Qualifier' ? 'selected' : ''}>Qualifier</option>
                                        <option value="RO32" ${currentAdminStage === 'RO32' ? 'selected' : ''}>RO32</option>
                                        <option value="RO16" ${currentAdminStage === 'RO16' ? 'selected' : ''}>RO16</option>
                                        <option value="Semi Final" ${currentAdminStage === 'Semi Final' ? 'selected' : ''}>Semi Final</option>
                                        <option value="Final" ${currentAdminStage === 'Final' ? 'selected' : ''}>Final</option>
                                        <option value="Grand Final" ${currentAdminStage === 'Grand Final' ? 'selected' : ''}>Grand Final</option>
                                    </select>
                                    <select name="mapMod" required class="bg-slate-900 border border-slate-600 text-white rounded-lg px-1 py-2 focus:outline-none focus:border-emerald-500 w-full sm:w-16 flex-shrink-0 text-center">
                                        <option value="NM">NM</option>
                                        <option value="HD">HD</option>
                                        <option value="HR">HR</option>
                                        <option value="DT">DT</option>
                                        <option value="MM">MM</option>
                                        <option value="TB">TB</option>
                                    </select>
                                    <input type="text" name="mapName" required placeholder="Nama Map (ex: NM5)" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-500">
                                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg transition font-medium whitespace-nowrap flex-shrink-0">
                                        <i class="fa-solid fa-plus mr-1"></i> Add
                                    </button>
                                </form>
                            </div>
                            <div class="flex-grow overflow-auto max-h-96 custom-scrollbar">
                                <table class="w-full">
                                    <tbody class="divide-y divide-slate-700">${beatmapRows}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const appDiv = document.getElementById('app');
            
            if (!state.currentUser) {
                appDiv.innerHTML = renderLogin();
                return;
            }

            let viewContent = '';
            switch (state.view) {
                case 'leaderboard': viewContent = renderLeaderboard(); break;
                case 'submit': viewContent = renderSubmitScore(); break;
                case 'admin':
                    if (state.currentUser.role === 'admin') viewContent = renderAdmin();
                    else { state.view = 'leaderboard'; viewContent = renderLeaderboard(); }
                    break;
                default: viewContent = renderLeaderboard();
            }

            appDiv.innerHTML = `
                ${renderNavbar()}
                <main class="flex-grow pb-10">${viewContent}</main>
            `;
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            if (!API_URL) {
                state.players = [
                    { id: 'admin1', username: 'admin', password: 'admin', role: 'admin' },

                ];
                const initialMaps = [
                    { id: 'nm1', stage: 'Qualifier', mod: 'NM', name: 'NM1' }, { id: 'nm2', stage: 'Qualifier', mod: 'NM', name: 'NM2' }, { id: 'nm3', stage: 'Qualifier', mod: 'NM', name: 'NM3' }, { id: 'nm4', stage: 'Qualifier', mod: 'NM', name: 'NM4' },
                    { id: 'hd1', stage: 'Qualifier', mod: 'HD', name: 'HD1' }, { id: 'hd2', stage: 'Qualifier', mod: 'HD', name: 'HD2' }, { id: 'hd3', stage: 'Qualifier', mod: 'HD', name: 'HD3' },
                    { id: 'hr1', stage: 'Qualifier', mod: 'HR', name: 'HR1' }, { id: 'hr2', stage: 'Qualifier', mod: 'HR', name: 'HR2' }, { id: 'hr3', stage: 'Qualifier', mod: 'HR', name: 'HR3' },
                    { id: 'dt1', stage: 'Qualifier', mod: 'DT', name: 'DT1' }, { id: 'dt2', stage: 'Qualifier', mod: 'DT', name: 'DT2' }, { id: 'dt3', stage: 'Qualifier', mod: 'DT', name: 'DT3' },
                    { id: 'mm1', stage: 'Qualifier', mod: 'MM', name: 'MM1' }, { id: 'mm2', stage: 'Qualifier', mod: 'MM', name: 'MM2' }, { id: 'tb1', stage: 'Qualifier', mod: 'TB', name: 'TB1' }
                ];
                state.beatmaps = initialMaps;
            } else {
                fetchDatabase();
            }
            renderApp();
        });
    </script>
</body>
</html>
